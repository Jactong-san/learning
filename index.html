<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hugo / Hazel 雙語學習總覽與互動課程中心</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Noto Serif TC', 'Songti TC', 'serif'],
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
            mono: ['Plus Jakarta Sans', 'Inter', 'monospace']
          }
        }
      }
    };
  </script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .keyword-tooltip {
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
    .has-tooltip:hover .keyword-tooltip {
      visibility: visible;
      opacity: 1;
    }
    .pinyin-font {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      letter-spacing: 0.025em;
    }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 font-sans min-h-screen flex flex-col selection:bg-amber-200 selection:text-amber-900">

  <!-- Toast Notification -->
  <div id="toastNotification" class="fixed top-5 right-5 z-50 transform translate-y-[-200%] transition-transform duration-300 bg-stone-900 text-white px-6 py-3 rounded-2xl shadow-xl flex items-center space-x-3 text-sm font-medium">
    <span id="toastIcon">✨</span>
    <span id="toastMessage">提示訊息</span>
  </div>

  <!-- Master Header -->
  <header class="bg-white border-b border-stone-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-2 flex items-center justify-between gap-2">
      <!-- Brand / Back to Master Directory -->
      <div class="flex items-center space-x-2.5 cursor-pointer" onclick="showMasterDirectory()">
        <div class="w-8 h-8 rounded-xl bg-amber-800 text-white flex items-center justify-center font-serif font-bold text-base shadow-sm">
          學
        </div>
        <div>
          <h1 class="font-serif font-bold text-sm md:text-base text-stone-900 tracking-wide leading-tight">學習中心 Learning Portal</h1>
          <p class="text-[10px] text-stone-500 font-medium">Hugo · Hazel 雙語課程目錄</p>
        </div>
      </div>

      <!-- Active Lesson Breadcrumb & Quick Return -->
      <div class="flex items-center space-x-2">
        <button onclick="showMasterDirectory()" id="backToMasterBtn" class="bg-stone-800 hover:bg-stone-900 text-white px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center space-x-1 transition-colors shadow-sm">
          <span>🏠</span>
          <span>返回目錄 Directory</span>
        </button>
      </div>

      <!-- Audio Speed Control -->
      <div class="flex items-center space-x-1 bg-stone-100 px-2.5 py-1 rounded-xl border border-stone-200 text-xs font-semibold text-stone-700">
        <span>🔊 語速:</span>
        <select id="audioSpeedSelect" onchange="changeAudioSpeed(this.value)" class="bg-transparent font-medium text-amber-900 outline-none cursor-pointer text-xs">
          <option value="0.7">0.7x</option>
          <option value="0.9" selected>0.9x</option>
          <option value="1.2">1.2x</option>
        </select>
      </div>
    </div>
  </header>

  <!-- =====================================================================
       VIEW 1: 3-STEP DRILL-DOWN DIRECTORY (PAGE 1: LEARNER -> PAGE 2: SUBJECT -> PAGE 3: CONTENT)
       ===================================================================== -->
  <main id="masterDirectoryView" class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-8 space-y-8">
    <!-- Breadcrumb Bar -->
    <div id="directoryBreadcrumb" class="flex items-center justify-center space-x-2 text-xs md:text-sm font-semibold text-stone-600 bg-white px-4 py-2.5 rounded-2xl border border-stone-200 shadow-sm w-fit mx-auto">
      <button onclick="goToStep1Learner()" class="hover:text-amber-800 transition-colors">🏠 選擇學習者 Learner</button>
      <span id="bcSep1" class="hidden text-stone-300">/</span>
      <button id="bcLearnerBtn" onclick="goToStep2Subject(selectedLearner)" class="hidden hover:text-amber-800 transition-colors"></button>
      <span id="bcSep2" class="hidden text-stone-300">/</span>
      <span id="bcSubjectLabel" class="hidden text-amber-800 font-bold"></span>
    </div>

    <!-- PAGE 1: CHOOSE HUGO OR HAZEL -->
    <section id="dirPage1Learner" class="space-y-6">
      <div class="text-center space-y-2">
        <span class="inline-block bg-amber-100 text-amber-900 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Step 1 · 選擇學習者</span>
        <h2 class="font-serif font-bold text-2xl md:text-3xl text-stone-900">請選擇學習者 Select Learner</h2>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-2xl mx-auto">
        <!-- Hugo Card -->
        <button onclick="goToStep2Subject('hugo')" class="group bg-white hover:bg-amber-50/70 rounded-3xl p-8 shadow-md border-2 border-stone-200 hover:border-amber-500 transition-all text-center space-y-4 cursor-pointer">
          <div class="w-20 h-20 rounded-3xl bg-amber-100 text-4xl flex items-center justify-center mx-auto group-hover:scale-105 transition-transform">👦</div>
          <div>
            <h3 class="font-serif font-bold text-3xl text-stone-900">Hugo</h3>
            <p class="text-xs text-stone-500 font-medium mt-1">French · 普通話 Mandarin</p>
          </div>
          <span class="inline-block bg-stone-900 group-hover:bg-amber-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition-colors">進入課程 Enter →</span>
        </button>

        <!-- Hazel Card -->
        <button onclick="goToStep2Subject('hazel')" class="group bg-white hover:bg-rose-50/70 rounded-3xl p-8 shadow-md border-2 border-stone-200 hover:border-rose-500 transition-all text-center space-y-4 cursor-pointer">
          <div class="w-20 h-20 rounded-3xl bg-rose-100 text-4xl flex items-center justify-center mx-auto group-hover:scale-105 transition-transform">👧</div>
          <div>
            <h3 class="font-serif font-bold text-3xl text-stone-900">Hazel</h3>
            <p class="text-xs text-stone-500 font-medium mt-1">French · 普通話 Mandarin</p>
          </div>
          <span class="inline-block bg-stone-900 group-hover:bg-rose-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition-colors">進入課程 Enter →</span>
        </button>
      </div>
    </section>

    <!-- PAGE 2: CHOOSE FRENCH OR MANDARIN -->
    <section id="dirPage2Subject" class="hidden space-y-6">
      <div class="text-center space-y-2">
        <span id="page2LearnerBadge" class="inline-block bg-amber-100 text-amber-900 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Step 2 · 選擇科目</span>
        <h2 id="page2Heading" class="font-serif font-bold text-2xl md:text-3xl text-stone-900">選擇科目 Select Subject</h2>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-2xl mx-auto">
        <!-- French Subject Card -->
        <button onclick="goToStep3Content('french')" class="group bg-white hover:bg-indigo-50/70 rounded-3xl p-8 shadow-md border-2 border-stone-200 hover:border-indigo-500 transition-all text-center space-y-4">
          <div class="w-20 h-20 rounded-3xl bg-indigo-100 text-4xl flex items-center justify-center mx-auto group-hover:scale-105 transition-transform">🇫🇷</div>
          <div>
            <h3 class="font-serif font-bold text-2xl text-stone-900">French</h3>
            <p class="text-xs text-stone-500 font-medium mt-1">法語課程 · French Lessons</p>
          </div>
          <span class="inline-block bg-indigo-700 group-hover:bg-indigo-800 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition-colors">查看課程 View →</span>
        </button>

        <!-- Mandarin Subject Card -->
        <button onclick="goToStep3Content('mandarin')" class="group bg-white hover:bg-amber-50/70 rounded-3xl p-8 shadow-md border-2 border-stone-200 hover:border-amber-500 transition-all text-center space-y-4">
          <div class="w-20 h-20 rounded-3xl bg-amber-100 text-4xl flex items-center justify-center mx-auto group-hover:scale-105 transition-transform">🏮</div>
          <div>
            <h3 class="font-serif font-bold text-2xl text-stone-900">普通話</h3>
            <p class="text-xs text-stone-500 font-medium mt-1">Mandarin Lessons</p>
          </div>
          <span class="inline-block bg-amber-700 group-hover:bg-amber-800 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition-colors">查看課程 View →</span>
        </button>
      </div>

      <div class="text-center pt-2">
        <button onclick="goToStep1Learner()" class="bg-white hover:bg-stone-50 text-stone-700 border border-stone-300 px-5 py-2.5 rounded-xl text-xs font-semibold shadow-sm">
          ← 返回選擇學習者 Back to Learners
        </button>
      </div>
    </section>

    <!-- PAGE 3: CONTENT UNITS -->
    <section id="dirPage3Content" class="hidden space-y-6">
      <div class="text-center space-y-2">
        <span id="page3Badge" class="inline-block bg-amber-100 text-amber-900 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Step 3 · 課程內容</span>
        <h2 id="page3Heading" class="font-serif font-bold text-2xl md:text-3xl text-stone-900">選擇單元 Select Lesson</h2>
      </div>

      <div id="page3UnitsContainer" class="max-w-2xl mx-auto space-y-4"></div>

      <div class="text-center pt-2">
        <button onclick="goToStep2Subject(selectedLearner)" class="bg-white hover:bg-stone-50 text-stone-700 border border-stone-300 px-5 py-2.5 rounded-xl text-xs font-semibold shadow-sm">
          ← 返回選擇科目 Back to Subjects
        </button>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-stone-200 py-6 text-center text-xs text-stone-500 space-y-1">
    <p>Hugo · Hazel 雙語學習總覽中心 (French & 普通話)</p>
    <p class="text-stone-400">GitHub Pages 互動學習目錄</p>
  </footer>

  <script>
    let selectedLearner = 'hugo';
    let selectedSubject = 'mandarin';

    // Exact GitHub repository filenames matching user's repo screenshot
    const CURRICULUM_TREE = {
      hugo: {
        name: 'Hugo',
        emoji: '👦',
        french: [
          {
            date: '2026.11.27',
            title: '🏟️ Sports Stadium, Past Mistakes & Accents',
            subtitle: '過去錯誤強化、重音選擇題、Unité 1 解答與體育場作業指南 (1er déc.)',
            badge: '✨ 最新 New',
            url: 'Hugo_FIS_Sports_Stadium_2026.11.27.html'
          },
          {
            date: '2026.11.20',
            title: '🌱 Toujours, Jamais & Rien (L\'environnement)',
            subtitle: '環保句型朗讀、14個核心詞彙字卡、動詞變化與 60 題測驗',
            badge: '✅ 開啟 Open',
            url: 'hugo_FIS_il_faut_toujours_et_jamais.html'
          },
          {
            date: '2026.11.14',
            title: '🇫🇷 FIS French (2026.11.14)',
            subtitle: 'Hugo FIS 法語互動課程與測驗',
            badge: '✅ 開啟 Open',
            url: 'Hugo_FIS_2026.11.14.html'
          }
        ],
        mandarin: [
          {
            date: '2026.11.21',
            title: '📜 詞語接龍與成語故事《不恥下問》',
            subtitle: '互動詞語接龍遊戲 · 7段成語故事 · 18個核心詞彙與聽力測驗',
            badge: '✨ 最新 New',
            url: 'Hugo_LA_20261121.html'
          },
          {
            date: '2026.11.14',
            title: '🐗 野豬與長頸鹿 (Wild Boar)',
            subtitle: '6段故事對話 · 16個核心詞彙 · 聽力測驗',
            badge: '✅ 開啟 Open',
            url: 'Hugo_LA_WildBoar_2026.11.14.html'
          },
          {
            date: '2026.11.07',
            title: '🧘‍♂️ 小和尚與冬瓜 (Little Monk & Winter Melon)',
            subtitle: '15段禪意故事 · 22個詞彙與成語 · 聽力測驗',
            badge: '✅ 開啟 Open',
            url: 'Hugo_LA_Monk_2026.11.07.html'
          }
        ]
      },
      hazel: {
        name: 'Hazel',
        emoji: '👧',
        french: [
          {
            date: '2026.11.27',
            title: '🌸 Les saisons (Je peux écrire des phrases)',
            subtitle: '季節句型與聽寫、關鍵字懸停提示、三回合測驗與重音挑戰',
            badge: '✨ 最新 New',
            url: 'hazel_FIS_les_saisons_2026.11.27.html'
          },
          {
            date: '2026.11.20',
            title: '🌤️ La Météo (Weather · 天氣詞彙與拼寫表)',
            subtitle: '6幅天氣場景插圖、Feuille d\'orthographe 拼寫練習與測驗',
            badge: '✅ 開啟 Open',
            url: 'Hazel_FIS_La_Meteo.html'
          }
        ]
      }
    };

    function showMasterDirectory() {
      goToStep1Learner();
    }

    function goToStep1Learner() {
      document.getElementById('dirPage1Learner').classList.remove('hidden');
      document.getElementById('dirPage2Subject').classList.add('hidden');
      document.getElementById('dirPage3Content').classList.add('hidden');

      document.getElementById('bcSep1').classList.add('hidden');
      document.getElementById('bcLearnerBtn').classList.add('hidden');
      document.getElementById('bcSep2').classList.add('hidden');
      document.getElementById('bcSubjectLabel').classList.add('hidden');
    }

    function goToStep2Subject(learnerKey) {
      selectedLearner = learnerKey;
      const learner = CURRICULUM_TREE[learnerKey];

      document.getElementById('dirPage1Learner').classList.add('hidden');
      document.getElementById('dirPage2Subject').classList.remove('hidden');
      document.getElementById('dirPage3Content').classList.add('hidden');

      document.getElementById('bcSep1').classList.remove('hidden');
      const bcLearnerBtn = document.getElementById('bcLearnerBtn');
      bcLearnerBtn.classList.remove('hidden');
      bcLearnerBtn.textContent = `${learner.emoji} ${learner.name}`;
      document.getElementById('bcSep2').classList.add('hidden');
      document.getElementById('bcSubjectLabel').classList.add('hidden');

      document.getElementById('page2LearnerBadge').textContent = `${learner.emoji} ${learner.name} · Step 2 選擇科目`;
      document.getElementById('page2Heading').textContent = `${learner.name} 的學習科目 Select Subject`;
    }

    function goToStep3Content(subjectKey) {
      selectedSubject = subjectKey;
      const learner = CURRICULUM_TREE[selectedLearner];
      const units = learner[subjectKey] || [];
      const subjectLabel = subjectKey === 'french' ? '🇫🇷 French' : '🏮 普通話 Mandarin';

      document.getElementById('dirPage1Learner').classList.add('hidden');
      document.getElementById('dirPage2Subject').classList.add('hidden');
      document.getElementById('dirPage3Content').classList.remove('hidden');

      document.getElementById('bcSep2').classList.remove('hidden');
      const bcSubjectLabel = document.getElementById('bcSubjectLabel');
      bcSubjectLabel.classList.remove('hidden');
      bcSubjectLabel.textContent = subjectLabel;

      document.getElementById('page3Badge').textContent = `${learner.emoji} ${learner.name} · ${subjectLabel}`;
      document.getElementById('page3Heading').textContent = `${learner.name} · ${subjectLabel} 課程內容`;

      const container = document.getElementById('page3UnitsContainer');
      if (units.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-3xl p-8 border border-stone-200 text-center space-y-2 shadow-sm">
            <div class="text-4xl">📭</div>
            <h3 class="font-serif font-bold text-lg text-stone-800">暫無已上架課程 No Lessons Yet</h3>
            <p class="text-xs text-stone-500">未來新增的課程將會顯示在這裡！</p>
          </div>
        `;
        return;
      }

      container.innerHTML = units.map(u => `
        <a href="${u.url}" class="block group p-5 rounded-3xl bg-white hover:bg-amber-50/60 border-2 border-stone-200 hover:border-amber-400 transition-all shadow-sm space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-mono font-bold bg-stone-800 text-white px-3 py-1 rounded-lg">${u.date}</span>
            <span class="text-xs font-semibold text-stone-700 bg-stone-100 px-3 py-1 rounded-full">${u.badge}</span>
          </div>
          <div class="flex items-center justify-between pt-1">
            <div>
              <h4 class="font-serif font-bold text-lg text-stone-900 group-hover:text-amber-900">${u.title}</h4>
              <p class="text-xs text-stone-600 mt-0.5">${u.subtitle}</p>
            </div>
            <span class="text-amber-800 font-bold text-xl group-hover:translate-x-1 transition-transform">↗</span>
          </div>
        </a>
      `).join('');
    }

    window.onload = function() {
      goToStep1Learner();
    };
  </script>
</body>
</html>
